name = "wezards-api"
main = "src/index.ts"
compatibility_date = "2024-04-01"

[vars]
ENVIRONMENT = "production"
CHAIN_ID = 97
MAX_WINNERS_TARGET = 1000
BNB_PRICE_USD_SNAPSHOT = 550.0

[[d1_databases]]
binding = "DB"
database_name = "wezards_db"
database_id = "00000000-0000-0000-0000-000000000000" # Local and mock fallback
migrations_dir = "migrations"
